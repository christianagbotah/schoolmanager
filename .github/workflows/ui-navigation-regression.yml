name: UI Navigation Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/ui-consistency.js'
      - 'assets/css/ui-consistency.css'
      - 'tests/ui-navigation-regression.test.js'
      - '.github/workflows/ui-navigation-regression.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/ui-consistency.js'
      - 'assets/css/ui-consistency.css'
      - 'tests/ui-navigation-regression.test.js'
      - '.github/workflows/ui-navigation-regression.yml'

permissions:
  contents: read

jobs:
  navigation-contract:
    name: Navigation interaction contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse shared UI script
        run: node --check assets/js/ui-consistency.js

      - name: Run navigation regression tests
        run: node --test tests/ui-navigation-regression.test.js