name: Temporary UI Consistency Bridge

on:
  push:
    branches:
      - ui-consistency-baseline-20261005

permissions:
  contents: write

jobs:
  apply-ui-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a28340c25a507baf2df84c131b043fa518ae13e2"

      - name: Download checksum-verified UI patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://schoolmanager.lightworldtech.com/bridge-ui-consistency-fe2cc21b8a5a.patch" \
            --output /tmp/ui-consistency.patch
          echo "78aa03ed1e739660ca91ee51ec2a186951c36dd588e5f129f4f7ccbbb7fa3e82  /tmp/ui-consistency.patch" | sha256sum --check --strict

      - name: Apply exact four-file patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/ui-consistency.patch
          git apply /tmp/ui-consistency.patch
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "application/views/backend/includes_bottom.php"
            "application/views/backend/includes_top.php"
            "assets/css/ui-consistency.css"
            "assets/js/ui-consistency.js"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          git -c core.whitespace=cr-at-eol diff --check

      - name: Validate shell assets
        shell: bash
        run: |
          set -euo pipefail
          php -l application/views/backend/includes_top.php
          php -l application/views/backend/includes_bottom.php
          node --check assets/js/ui-consistency.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('assets/css/ui-consistency.css').read_text()
          assert css.count('{') == css.count('}'), 'CSS braces are unbalanced'
          assert '--sm-ui-control-height: 42px' in css
          assert '--sm-ui-title-size: 24px' in css
          assert '--sm-topbar-height-dynamic' in css
          assert 'align-items: flex-end !important' in css
          assert '#marks_selector_form' in css
          js = Path('assets/js/ui-consistency.js').read_text()
          assert 'ResizeObserver' in js
          assert 'getBoundingClientRect' in js
          top = Path('application/views/backend/includes_top.php').read_text()
          bottom = Path('application/views/backend/includes_bottom.php').read_text()
          assert top.count('ui-consistency.css') == 1
          assert bottom.count('ui-consistency.js') == 1
          print('UI consistency validation passed')
          PY

      - name: Commit to applied branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/views/backend/includes_top.php application/views/backend/includes_bottom.php assets/css/ui-consistency.css assets/js/ui-consistency.js
          git commit -m "fix(ui): enforce consistent backend spacing and control sizing"
          git push origin HEAD:refs/heads/ui-consistency-applied-20261005
