name: Apply Admin Dashboard KPI Fix

on:
  push:
    branches: [fix/admin-dashboard-kpi-contract]
    paths:
      - 'scripts/apply-admin-dashboard-kpi-contract.py'
      - '.github/workflows/apply-admin-dashboard-kpi-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-dashboard-kpi-contract
      - name: Apply deterministic dashboard migration
        run: python3 scripts/apply-admin-dashboard-kpi-contract.py
      - name: Verify generated dashboard contract
        run: node --test tests/admin-dashboard-contract.test.js
      - name: Commit generated dashboard when changed
        run: |
          if git diff --quiet -- application/views/backend/admin/dashboard.php; then
            echo "Dashboard already satisfies generated contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/views/backend/admin/dashboard.php
          git commit -m "fix(ui): restore approved admin dashboard KPI rows"
          git push origin HEAD:fix/admin-dashboard-kpi-contract
