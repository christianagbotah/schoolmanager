name: Temporary UI Consistency Wave Three Bridge

on:
  push:
    branches:
      - ui-wave3-baseline-20261005

permissions:
  contents: write

jobs:
  apply-ui-wave-three:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7e669742562255cbe81abd0bdcc665e33415318c"

      - name: Download checksum-verified patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://schoolmanager.lightworldtech.com/bridge-ui-wave3-867f3b75a626.patch" -o /tmp/ui-wave3.patch
          echo "d50bd5ae6c105550cca7199e4b2b14dbfe8c5e821756ad50ac26a24878a3b529  /tmp/ui-wave3.patch" | sha256sum -c -

      - name: Apply exact six-file patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/ui-wave3.patch
          git apply /tmp/ui-wave3.patch
          cat > /tmp/expected-files <<'EOF'
          application/views/backend/admin/cashier_daily_summary.php
          application/views/backend/admin/change_term.php
          application/views/backend/admin/expense_category.php
          application/views/backend/admin/fee_collection_statistics.php
          application/views/backend/admin/grade.php
          application/views/backend/admin/student_add.php
          EOF
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Validate UI consistency contract
        shell: bash
        run: |
          set -euo pipefail
          files=(
            application/views/backend/admin/cashier_daily_summary.php
            application/views/backend/admin/change_term.php
            application/views/backend/admin/expense_category.php
            application/views/backend/admin/fee_collection_statistics.php
            application/views/backend/admin/grade.php
            application/views/backend/admin/student_add.php
          )
          for f in "${files[@]}"; do php -l "$f"; done
          grep -Fq 'font-size: 24px; line-height: 1.2' application/views/backend/admin/student_add.php
          grep -Fq 'font-size: 24px !important;' application/views/backend/admin/grade.php
          grep -Fq '.expense-category-workspace .btn {' application/views/backend/admin/expense_category.php
          grep -Fq 'font-size: 24px; line-height: 1.2' application/views/backend/admin/cashier_daily_summary.php
          grep -Fq 'var(--sm-ui-control-height, 42px)' application/views/backend/admin/change_term.php
          grep -Fq 'font-size: 24px; color: white;">Fee Collection Statistics' application/views/backend/admin/fee_collection_statistics.php
          ! grep -Eq '^\* \{|^\.btn \{|^\.btn-primary|^\.header \{|^\.card-header \{|^\.empty-state \{' application/views/backend/admin/expense_category.php

      - name: Commit applied branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b ui-wave3-applied-20261005
          git add application/views/backend/admin/cashier_daily_summary.php \
                  application/views/backend/admin/change_term.php \
                  application/views/backend/admin/expense_category.php \
                  application/views/backend/admin/fee_collection_statistics.php \
                  application/views/backend/admin/grade.php \
                  application/views/backend/admin/student_add.php
          git commit -m 'fix(ui): normalize admission finance and grading chrome'
          git push origin HEAD
