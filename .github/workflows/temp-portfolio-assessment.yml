name: Temporary Portfolio Assessment Bridge

on:
  push:
    branches:
      - portfolio-assessment-baseline-20261005

permissions:
  contents: write

jobs:
  apply-portfolio-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cb1d29773c87fc8b327d496d14656c7f79bacf83"

      - name: Download checksum-verified portfolio patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://schoolmanager.lightworldtech.com/bridge-portfolio-4bbd027a175a.patch" \
            --output /tmp/portfolio.patch
          echo "db1845911fcdd487f764998d3905c941c1d4803bcccd89c711198d5cfb245fe0  /tmp/portfolio.patch" | sha256sum --check --strict

      - name: Apply exact six-file patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/portfolio.patch
          git apply /tmp/portfolio.patch
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "application/controllers/Admin.php"
            "application/views/backend/admin/portfolio_assessment_manage.php"
            "application/views/backend/admin/portfolio_assessment_manage_view.php"
            "application/views/backend/admin/portfolio_get_subjects.php"
            "application/views/backend/teacher/portfolio_assessment_manage.php"
            "application/views/backend/teacher/portfolio_assessment_manage_view.php"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          git -c core.whitespace=cr-at-eol diff --check

      - name: Validate portfolio workflow
        shell: bash
        run: |
          set -euo pipefail
          files=(
            application/controllers/Admin.php
            application/views/backend/admin/portfolio_assessment_manage.php
            application/views/backend/admin/portfolio_assessment_manage_view.php
            application/views/backend/admin/portfolio_get_subjects.php
            application/views/backend/teacher/portfolio_assessment_manage.php
            application/views/backend/teacher/portfolio_assessment_manage_view.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          grep -q "expected_cells" application/controllers/Admin.php
          grep -q "period_field = \$is_jhs ? 'sem' : 'term'" application/controllers/Admin.php
          grep -q "Assessment row order changed" application/controllers/Admin.php
          grep -q "mark_sync" application/controllers/Admin.php
          grep -q "pa-filter-grid" application/views/backend/admin/portfolio_assessment_manage.php
          grep -q "pa-table-wrap" application/views/backend/admin/portfolio_assessment_manage_view.php
          grep -q "pa-filter-grid" application/views/backend/teacher/portfolio_assessment_manage.php
          grep -q "pa-table-wrap" application/views/backend/teacher/portfolio_assessment_manage_view.php
          grep -q "subject_filter\['sem'\]" application/views/backend/admin/portfolio_get_subjects.php
          if grep -R -q 'foreach($classes_ as $rowc)' application/views/backend/admin/portfolio_assessment_manage.php application/views/backend/admin/portfolio_assessment_manage_view.php application/views/backend/teacher/portfolio_assessment_manage.php application/views/backend/teacher/portfolio_assessment_manage_view.php; then
            echo 'Legacy undefined $classes_ reference remains'
            exit 1
          fi
          if grep -q "'sen'[[:space:]]*=>" application/views/backend/admin/portfolio_get_subjects.php; then
            echo 'Legacy sen/sem typo remains'
            exit 1
          fi
          echo 'Portfolio workflow validation passed'

      - name: Commit to applied branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/controllers/Admin.php application/views/backend/admin/portfolio_assessment_manage.php application/views/backend/admin/portfolio_assessment_manage_view.php application/views/backend/admin/portfolio_get_subjects.php application/views/backend/teacher/portfolio_assessment_manage.php application/views/backend/teacher/portfolio_assessment_manage_view.php
          git commit -m "feat(exams): rebuild portfolio assessment workflow"
          git push origin HEAD:refs/heads/portfolio-assessment-applied-20261005
