name: Bulk Receipts Auth Boundary

on:
  pull_request:
    paths:
      - 'application/controllers/Bulk_receipts.php'
      - 'tests/bulk-receipts-auth-boundary.test.js'
      - '.github/workflows/bulk-receipts-auth.yml'
  push:
    branches: [main]
    paths:
      - 'application/controllers/Bulk_receipts.php'
      - 'tests/bulk-receipts-auth-boundary.test.js'
      - '.github/workflows/bulk-receipts-auth.yml'

jobs:
  auth-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bulk receipts auth contract
        run: node --test tests/bulk-receipts-auth-boundary.test.js
      - name: PHP syntax
        run: php -l application/controllers/Bulk_receipts.php
