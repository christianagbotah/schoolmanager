name: Cashier Cash Change Helper

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/views/backend/cashier/daily_fee_collection.php'
      - 'tests/cashier-cash-change-helper.test.js'
      - '.github/workflows/cashier-cash-change-helper.yml'
  push:
    branches:
      - main
      - 'feat/cashier-cash-change-helper'
    paths:
      - 'application/views/backend/cashier/daily_fee_collection.php'
      - 'tests/cashier-cash-change-helper.test.js'
      - '.github/workflows/cashier-cash-change-helper.yml'

permissions:
  contents: read

jobs:
  cashier-cash-change-helper:
    name: Cash change helper contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cash change regression contract
        run: node --test tests/cashier-cash-change-helper.test.js
      - name: Lint cashier collection view
        run: php -l application/views/backend/cashier/daily_fee_collection.php
