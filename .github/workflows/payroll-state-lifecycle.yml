name: Payroll State Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/models/Payroll_model.php'
      - 'application/models/Payroll_approval_model.php'
      - 'tests/payroll-state-lifecycle.test.js'
      - '.github/workflows/payroll-state-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'application/models/Payroll_model.php'
      - 'application/models/Payroll_approval_model.php'
      - 'tests/payroll-state-lifecycle.test.js'
      - '.github/workflows/payroll-state-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    name: Payroll state and notification contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse payroll PHP
        run: |
          php -l application/models/Payroll_model.php
          php -l application/models/Payroll_approval_model.php
      - name: Run payroll lifecycle regression contract
        run: node --test tests/payroll-state-lifecycle.test.js
