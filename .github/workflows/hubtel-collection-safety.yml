name: Hubtel Collection Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/controllers/Payment_gateway.php'
      - 'application/models/Hubtel_payment_model.php'
      - 'tests/hubtel-collection-safety.test.js'
      - 'tests/hubtel_collection_callback_auth_behavior_test.php'
      - '.github/workflows/hubtel-collection-safety.yml'
  push:
    branches: [main]
    paths:
      - 'application/controllers/Payment_gateway.php'
      - 'application/models/Hubtel_payment_model.php'
      - 'tests/hubtel-collection-safety.test.js'
      - 'tests/hubtel_collection_callback_auth_behavior_test.php'
      - '.github/workflows/hubtel-collection-safety.yml'

permissions:
  contents: read

jobs:
  collection-safety:
    name: Hubtel collection safety contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse hardened Hubtel PHP
        run: |
          php -l application/models/Hubtel_payment_model.php
          php -l application/controllers/Payment_gateway.php
      - name: Run Hubtel collection regression contract
        run: node --test tests/hubtel-collection-safety.test.js
      - name: Run callback authentication behavior contract
        run: php tests/hubtel_collection_callback_auth_behavior_test.php
