name: Deployment Handoff

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolmanager-deployment-handoff
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release for VPS pull deployer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP changed in this release
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- '*.php')
          else
            mapfile -t FILES < <(find application -name '*.php' -not -path '*/third_party/*')
            FILES+=(index.php)
          fi

          for f in "${FILES[@]}"; do
            [ -f "$f" ] || continue
            php -l "$f" >/dev/null
            echo "OK $f"
          done

      - name: Verify deployment contract
        shell: bash
        run: |
          set -euo pipefail
          TARGET="/home/lightworld/webapps/schoolmanager"
          if [[ "$TARGET" == *"rochas"* ]]; then
            echo "::error::Invalid deployment target"
            exit 1
          fi

          echo "Deployment target: $TARGET"
          echo "Runtime data is preserved by Git/ignore rules."
          echo "No GitHub SSH deployment secrets are required."
          echo "The VPS service schoolmanager-deploy.service polls origin/main and deploys validated fast-forwards."

      - name: Deployment handoff summary
        run: |
          {
            echo "## SchoolManager deployment handoff"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Target: \`/home/lightworld/webapps/schoolmanager\`"
            echo "- Mechanism: VPS-side Git pull deployer"
            echo "- Poll cadence: every minute"
            echo "- Runtime data preserved: uploads, DB/email config, .env, cache, logs"
            echo "- Rollback: automatic code rollback on failed local health check"
            echo "- \`/home/lightworld/webapps/rochas\`: never accessed or deployed"
          } >> "$GITHUB_STEP_SUMMARY"
