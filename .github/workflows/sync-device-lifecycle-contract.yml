name: Sync Device Lifecycle Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/models/Sync_model.php'
      - 'application/controllers/Sync_server.php'
      - 'application/views/backend/admin/sync_devices.php'
      - 'application/views/backend/admin/navigation.php'
      - 'tests/sync-device-lifecycle-contract.test.js'
      - 'tests/sync_device_lifecycle_behavior_test.php'
      - '.github/workflows/sync-device-lifecycle-contract.yml'
  push:
    branches: [main]
    paths:
      - 'application/models/Sync_model.php'
      - 'application/controllers/Sync_server.php'
      - 'application/views/backend/admin/sync_devices.php'
      - 'application/views/backend/admin/navigation.php'
      - 'tests/sync-device-lifecycle-contract.test.js'
      - 'tests/sync_device_lifecycle_behavior_test.php'
      - '.github/workflows/sync-device-lifecycle-contract.yml'

permissions:
  contents: read

jobs:
  device-lifecycle-contract:
    name: Device lifecycle security contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Run structural contract
        run: node --test tests/sync-device-lifecycle-contract.test.js
      - name: Run lifecycle behavior contract
        run: php tests/sync_device_lifecycle_behavior_test.php
      - name: PHP syntax
        run: |
          php -l application/models/Sync_model.php
          php -l application/controllers/Sync_server.php
