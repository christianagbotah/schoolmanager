name: Cashier Dashboard KPI Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/views/backend/cashier/cashier_dashboard.php'
      - 'tests/cashier-dashboard-kpi-contract.test.js'
      - '.github/workflows/cashier-dashboard-kpi-contract.yml'
  push:
    branches:
      - main
      - 'feat/cashier-dashboard-kpis'
    paths:
      - 'application/views/backend/cashier/cashier_dashboard.php'
      - 'tests/cashier-dashboard-kpi-contract.test.js'
      - '.github/workflows/cashier-dashboard-kpi-contract.yml'

permissions:
  contents: read

jobs:
  cashier-dashboard-kpis:
    name: Cashier-scoped daily KPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cashier dashboard KPI regression contract
        run: node --test tests/cashier-dashboard-kpi-contract.test.js
