name: Payroll Model Surgical Patch

on:
  push:
    branches:
      - fix/payroll-state-lifecycle
    paths:
      - '.github/workflows/payroll-model-surgical-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payroll-state-lifecycle
          fetch-depth: 0
      - name: Patch payroll lifecycle without rewriting unrelated logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('application/models/Payroll_model.php')
          text = path.read_bytes().decode('utf-8')
          original = text

          old_approval = "$data['approval_status'] = 'paid'; // Automatically mark as paid - skip approval workflow"
          old_status = "$data['status'] = 'paid'; // Set status to paid as well"
          assert text.count(old_approval) == 1, 'Expected exactly one automatic paid approval assignment'
          assert text.count(old_status) == 1, 'Expected exactly one automatic paid status assignment'
          text = text.replace(old_approval, "$data['approval_status'] = 'draft'; // Calculation creates an obligation; approval/payment happen later")
          text = text.replace(old_status, "$data['status'] = 'draft'; // Do not report payment before an actual disbursement")

          prep_pattern = re.compile(r"\r?\n[\t ]*/\*preparing sms\*/[\s\S]*?(?=\r?\n[\t ]*endfor;)")
          text, prep_count = prep_pattern.subn("\r\n\r\n\t                // Payment notification is intentionally deferred until mark_as_paid().", text, count=1)
          assert prep_count == 1, 'Payroll credited-SMS preparation block was not found exactly once'

          send_pattern = re.compile(r"\r?\n[\t ]*if\(\$result == true\) \{\r?\n[\t ]*/\*send sms\*/[\s\S]*?\r?\n[\t ]*\}(?=\r?\n\r?\n[\t ]*return \$result;)")
          text, send_count = send_pattern.subn("\r\n\t\t\t\t// Employee payment notifications are sent only by the paid transition.", text, count=1)
          assert send_count == 1, 'Payroll SMS sending block was not found exactly once'

          assert 'Your account has been credited with' not in text
          assert "send_sms_batch_personalized($sms_data_array)" not in text
          assert text != original
          path.write_bytes(text.encode('utf-8'))
          PY
      - name: Remove one-off patch workflow
        run: rm .github/workflows/payroll-model-surgical-patch.yml
      - name: Commit surgical lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/models/Payroll_model.php .github/workflows/payroll-model-surgical-patch.yml
          git commit -m "fix: keep calculated payroll in draft until payment"
          git push origin HEAD:fix/payroll-state-lifecycle
