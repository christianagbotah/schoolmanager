name: Temporary Finance Hardening Bridge

on:
  push:
    branches:
      - bridge/finance-hardening-20261005-run

permissions:
  contents: write

jobs:
  apply-finance-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "03c9e34baada8a358f25310b6d3755cab5839061"

      - name: Download checksum-verified audited patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://schoolmanager.lightworldtech.com/bridge-finance-30f38bc13055f9ce.patch" \
            --output /tmp/finance-hardening.patch
          echo "30f38bc13055f9ce4c5d93b3d33acb9a54d3d2e98c199a8ea2c7c650129ff695  /tmp/finance-hardening.patch" | sha256sum --check --strict

      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/finance-hardening.patch
          git apply /tmp/finance-hardening.patch
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "application/controllers/Admin.php"
            "application/controllers/Approval_requests.php"
            "application/models/Crud_model.php"
            "application/views/backend/admin/receipt_invoice_modification_requests.php"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          git -c core.whitespace=cr-at-eol diff --check

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate finance workflow
        shell: bash
        run: |
          set -euo pipefail
          php -l application/controllers/Admin.php
          php -l application/controllers/Approval_requests.php
          php -l application/models/Crud_model.php
          php -l application/views/backend/admin/receipt_invoice_modification_requests.php
          grep -q "function createInvoiceDeleteRequest" application/models/Crud_model.php
          grep -q "Deletion is not approved for one or more selected invoices" application/controllers/Admin.php
          grep -q "invoice_delete" application/views/backend/admin/receipt_invoice_modification_requests.php
          grep -q "This legacy approval endpoint has been retired" application/controllers/Approval_requests.php
          grep -q "subject_first_word" application/controllers/Admin.php
          if grep -q "row3\['name'\]" application/controllers/Admin.php; then
            echo "Exam SMS regression detected"
            exit 1
          fi
          echo "Changed files:"
          git diff --name-only
          echo "Diff stat:"
          git diff --stat

      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/controllers/Admin.php application/controllers/Approval_requests.php application/models/Crud_model.php application/views/backend/admin/receipt_invoice_modification_requests.php
          git commit -m "fix(finance): harden invoice delete approval workflow"
          git push origin HEAD:main
