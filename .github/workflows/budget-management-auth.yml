name: Budget Management Auth Boundary

on:
  pull_request:
    paths:
      - 'application/controllers/Budget_management.php'
      - 'tests/budget-management-auth-boundary.test.js'
      - '.github/workflows/budget-management-auth.yml'
  push:
    branches: [main]
    paths:
      - 'application/controllers/Budget_management.php'
      - 'tests/budget-management-auth-boundary.test.js'
      - '.github/workflows/budget-management-auth.yml'

jobs:
  auth-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Budget management auth contract
        run: node --test tests/budget-management-auth-boundary.test.js
      - name: PHP syntax
        run: php -l application/controllers/Budget_management.php
